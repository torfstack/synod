name: pr-checks
run-name: ${{ github.actor }} is running pr checks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup mise
        uses: jdx/mise-action@v4
      - name: Run tests
        run: |
          set -euo pipefail
          task test 2>&1 | tee /tmp/gotest.log
      - name: Upload test log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-log
          path: /tmp/gotest.log
          if-no-files-found: error
  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup mise
        uses: jdx/mise-action@v4
      - name: install frontend dependencies
        run: task frontend-install
      - name: run linter
        run: |
          set -euo pipefail
          task lint
