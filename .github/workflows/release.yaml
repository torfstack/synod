name: release
run-name: ${{ github.actor }} is releasing a new version

on:
  push:
    branches:
      - 'main'

concurrency:
  group: synod-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: setup mise
        uses: jdx/mise-action@v4
      - name: install frontend dependencies
        run: task frontend-install
      - name: validate
        run: |
          task lint
          task test
      - name: select version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin --tags
          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "This commit already has a release tag; refusing to publish it again." >&2
            exit 1
          fi
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name')
          release_labels=$(printf '%s\n' "$labels" | grep -E '^release:(patch|minor|major)$' || true)
          release_label_count=$(printf '%s\n' "$release_labels" | awk 'NF { count++ } END { print count + 0 }')
          if [ "$release_label_count" -gt 1 ]; then
            echo "A pull request may have only one release bump label." >&2
            exit 1
          fi
          bump=${release_labels#release:}
          bump=${bump:-patch}
          version=$(task next-version BUMP="$bump")
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: setup docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release new version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: task release VERSION="$VERSION"
      - name: create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
