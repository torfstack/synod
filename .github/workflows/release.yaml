name: release
run-name: ${{ github.actor }} is releasing a new version

on:
  push:
    branches:
      - 'main'

concurrency:
  group: synod-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: setup mise
        uses: jdx/mise-action@v4
      - name: install frontend dependencies
        run: task frontend-install
      - name: validate
        run: |
          task lint
          task test
      - name: select version
        id: version
        run: |
          git fetch origin --tags
          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "This commit already has a release tag; refusing to publish it again." >&2
            exit 1
          fi
          version=$(task next-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: setup docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release new version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: task release VERSION="$VERSION"
      - name: create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
